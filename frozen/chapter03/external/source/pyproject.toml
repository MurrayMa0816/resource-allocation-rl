[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-allocation-research"
version = "1.1.0"
description = "Unified resource allocation research: current environments, methods and shared baselines"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "torch>=2.4,<3", "gymnasium>=1.2,<2", "scipy>=1.14,<2", "matplotlib>=3.10,<4", "Pillow>=10,<12", "psutil>=6,<8"]

[project.scripts]
allocation23 = "allocation23.__main__:main"
resource-allocation = "allocation23.cli:main"

[tool.setuptools]
license-files = ["applications/irrigation/LICENSE", "applications/irrigation/THIRD_PARTY_NOTICES.rst", "allocation23/baselines/cores/*LICENSE*.txt"]

[tool.setuptools.packages.find]
where = [".", "applications/irrigation/src"]
include = ["allocation23*", "irrigation_rl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
allocation23 = ["project.json", "environments/_emergency/configs/*.json", "data/eurosat_rgb/*.npy", "data/eurosat_rgb/*.json", "assets/*.ttf", "assets/*.txt", "baselines/cores/*.json", "baselines/cores/*.txt"]

"allocation23.chapter3_candidates" = ["profiles/*.json", "licenses/*", "*.json", "*.rst"]

"allocation23.chapter3_baselines" = ["vendor/**/*.py", "vendor/**/*.json", "vendor/**/*.yaml", "vendor/**/*.yml", "vendor/**/*.xml", "vendor/**/*.png", "vendor/**/*.tex", "vendor/**/*.md", "vendor/**/*.txt", "vendor/**/*.in", "vendor/**/*.sh", "vendor/**/LICENSE*", "vendor/safedreamer/.gitignore"]

irrigation_rl = ["data/hongmiao93/*", "data/display/*"]

[tool.setuptools.data-files]
"share/resource-allocation/irrigation" = ["applications/irrigation/LICENSE", "applications/irrigation/THIRD_PARTY_NOTICES.rst", "applications/irrigation/CITATION.cff"]
